# ============================================
# PT Sopiak Satria Saga — Docker Compose (Coolify edition)
# ============================================
# Tahap 5+ hotfix: routing via Traefik Docker labels.
# Replace dependency to /data/coolify/proxy/dynamic/sopiak.yml which
# breaks every deploy because it hardcodes container names. With labels,
# Traefik auto-discovers each service on (re)deploy.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ptsss_db}
      POSTGRES_USER: ${DB_USER:-ptsss_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ptsss_user} -d ${DB_NAME:-ptsss_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ptsss_db}
      DB_USER: ${DB_USER:-ptsss_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: "false"
      DB_POOL_MAX: "10"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-true}
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_URL: ${API_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      RATE_LIMIT_BYPASS_SECRET: ${RATE_LIMIT_BYPASS_SECRET:-}
      SERVICE_FQDN_BACKEND_3000: https://api.sopiaksatriasaga.com
      TZ: Asia/Jakarta
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_downloads:/app/downloads
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.sopiak-backend.rule=Host(`api.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-backend.entrypoints=https"
      - "traefik.http.routers.sopiak-backend.tls=true"
      - "traefik.http.routers.sopiak-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sopiak-backend.service=sopiak-backend"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.sopiak-backend-http.rule=Host(`api.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-backend-http.entrypoints=http"
      - "traefik.http.routers.sopiak-backend-http.middlewares=sopiak-https-redirect"
      # Service definition (port 3000)
      - "traefik.http.services.sopiak-backend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  web-admin:
    build:
      context: ./web-admin-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEBADMIN_3001: https://hq.sopiaksatriasaga.com
      TZ: Asia/Jakarta
    expose:
      - "3001"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.sopiak-webadmin.rule=Host(`hq.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-webadmin.entrypoints=https"
      - "traefik.http.routers.sopiak-webadmin.tls=true"
      - "traefik.http.routers.sopiak-webadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sopiak-webadmin.service=sopiak-webadmin"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.sopiak-webadmin-http.rule=Host(`hq.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-webadmin-http.entrypoints=http"
      - "traefik.http.routers.sopiak-webadmin-http.middlewares=sopiak-https-redirect"
      # Service definition (port 3001)
      - "traefik.http.services.sopiak-webadmin.loadbalancer.server.port=3001"
      # Shared HTTPS redirect middleware (declared once, shared by all)
      - "traefik.http.middlewares.sopiak-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sopiak-https-redirect.redirectscheme.permanent=true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEBSITE_3002: https://sopiaksatriasaga.com
      TZ: Asia/Jakarta
    expose:
      - "3002"
    labels:
      - "traefik.enable=true"
      # HTTPS router — accept both apex and www
      - "traefik.http.routers.sopiak-website.rule=Host(`sopiaksatriasaga.com`) || Host(`www.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-website.entrypoints=https"
      - "traefik.http.routers.sopiak-website.tls=true"
      - "traefik.http.routers.sopiak-website.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sopiak-website.service=sopiak-website"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.sopiak-website-http.rule=Host(`sopiaksatriasaga.com`) || Host(`www.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-website-http.entrypoints=http"
      - "traefik.http.routers.sopiak-website-http.middlewares=sopiak-https-redirect"
      # Service definition (port 3002)
      - "traefik.http.services.sopiak-website.loadbalancer.server.port=3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD required}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_LISTEN_PORT: 80
      SERVICE_FQDN_PGADMIN_80: https://pgadmin.sopiaksatriasaga.com
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.sopiak-pgadmin.rule=Host(`pgadmin.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-pgadmin.entrypoints=https"
      - "traefik.http.routers.sopiak-pgadmin.tls=true"
      - "traefik.http.routers.sopiak-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sopiak-pgadmin.service=sopiak-pgadmin"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.sopiak-pgadmin-http.rule=Host(`pgadmin.sopiaksatriasaga.com`)"
      - "traefik.http.routers.sopiak-pgadmin-http.entrypoints=http"
      - "traefik.http.routers.sopiak-pgadmin-http.middlewares=sopiak-https-redirect"
      # Service definition (port 80)
      - "traefik.http.services.sopiak-pgadmin.loadbalancer.server.port=80"

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:
  backend_backups:
  backend_downloads:
  pgadmin_data:
